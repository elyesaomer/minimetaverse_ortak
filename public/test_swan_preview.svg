  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">Pürüzsüz vektörel Sanalika sanat tarzı, çift kişilik kokpit, su dalgaları ve dinamik açılar</text>

  <!-- 8 Directions Grid -->

  <g transform="translate(120, 160)">
